name: Deploy via vps-dashboard-domains (reusable)

on:
  workflow_call:
    inputs:
      domain:
        description: "Doména aplikace (např. app.onremote.cz) – určuje /srv/apps/<doména> a službu vps-app-*"
        required: true
        type: string
      port:
        description: "Port aplikace na VPS (1024–65535)"
        required: true
        type: string
      branch:
        description: "Nasazovaná větev"
        required: false
        type: string
        default: "main"
      force_https:
        description: "Vynutit HTTPS (1/0)"
        required: false
        type: string
        default: "1"
      www_redirect:
        description: "Přesměrovat www variantu (1/0)"
        required: false
        type: string
        default: "0"
      automatic_ssl:
        description: "Automatické SSL certifikáty (1/0)"
        required: false
        type: string
        default: "1"
      health_path:
        description: "Cesta pro health check na 127.0.0.1:<port> (např. /health)"
        required: false
        type: string
        default: "/"
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSH_PORT:
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOMAIN: ${{ inputs.domain }}
          APP_PORT: ${{ inputs.port }}
          BRANCH: ${{ inputs.branch }}
          FORCE_HTTPS: ${{ inputs.force_https }}
          WWW_REDIRECT: ${{ inputs.www_redirect }}
          AUTOMATIC_SSL: ${{ inputs.automatic_ssl }}
          HEALTH_PATH: ${{ inputs.health_path }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 40m
          envs: DOMAIN,APP_PORT,BRANCH,FORCE_HTTPS,WWW_REDIRECT,AUTOMATIC_SSL,HEALTH_PATH,REPO_URL
          script: |
            set -Eeuo pipefail

            command -v vps-dashboard-domains >/dev/null \
              || { echo "Helper vps-dashboard-domains není nainstalovaný." >&2; exit 1; }

            vps-dashboard-domains domain-deploy \
              "$DOMAIN" \
              "$REPO_URL" \
              "$BRANCH" \
              "$APP_PORT" \
              "$FORCE_HTTPS" \
              "$WWW_REDIRECT" \
              "$AUTOMATIC_SSL"

            SERVICE_NAME="vps-app-${DOMAIN//./-}"
            systemctl is-active --quiet "$SERVICE_NAME"

            for i in $(seq 1 30); do
              if curl --fail --silent --output /dev/null "http://127.0.0.1:${APP_PORT}${HEALTH_PATH}"; then
                echo "Health check OK"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed" >&2
            journalctl -u "$SERVICE_NAME" -n 30 --no-pager || true
            exit 1
