name: Deploy

on:
  push:
    branches: [ $default-branch ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: davidfronek/.github/.github/workflows/deploy-vps-reusable.yml@main
    with:
      # Doména aplikace na VPS – určuje /srv/apps/<doména> a službu vps-app-*
      domain: moje-app.onremote.cz
      # Port aplikace
      port: "3000"
      # Volitelné: health_path: /health, force_https: "1", www_redirect: "0", automatic_ssl: "1"
      health_path: /
    secrets: inherit
