name: Deploy

on:
  push:
    branches: [ $default-branch ]
  workflow_dispatch:

jobs:
  deploy:
    uses: davidfronek/.github/.github/workflows/deploy-vps-reusable.yml@main
    with:
      # Cílový adresář na VPS – nastavte jako repository variable (Settings -> Secrets and variables -> Actions -> Variables)
      deploy_path: ${{ vars.DEPLOY_PATH }}
      # Upravte podle projektu (monorepo: např. "npm ci && npm --prefix client ci && npm --prefix client run build")
      build_command: "npm ci && npm run build"
      dist_dir: "dist"
      # Volitelné – např. restart služby: "sudo systemctl restart moje-app"
      post_deploy_command: ""
    secrets: inherit
